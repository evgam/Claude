#version=RHEL9
# RHEL 9 Kickstart Configuration File

###############################################################################
# Installation Method
###############################################################################
# Install from the first optical drive
cdrom
# Alternatively, use a network source:
# url --url="http://mirror.example.com/rhel9/BaseOS/x86_64/os/"

###############################################################################
# System Language and Keyboard
###############################################################################
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'

###############################################################################
# Network Configuration
###############################################################################
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=rhel9-server

###############################################################################
# Root Password (change before use — this is a placeholder hash)
# Generate with: python3 -c "import crypt; print(crypt.crypt('YourPassword', crypt.mksalt(crypt.METHOD_SHA512)))"
###############################################################################
rootpw --iscrypted $6$rounds=4096$CHANGEMESALT$CHANGEME_REPLACE_WITH_REAL_HASH

###############################################################################
# Create a non-root admin user
###############################################################################
user --name=admin --groups=wheel --gecos="Admin User" --password=$6$rounds=4096$CHANGEMESALT$CHANGEME_REPLACE_WITH_REAL_HASH --iscrypted

###############################################################################
# Security Policy (optional — comment out if not required)
###############################################################################
# authselect select sssd --force

###############################################################################
# SELinux
###############################################################################
selinux --enforcing

###############################################################################
# Firewall
###############################################################################
firewall --enabled --ssh

###############################################################################
# System Services
###############################################################################
services --enabled="chronyd,sshd"

###############################################################################
# System Timezone
###############################################################################
timezone America/New_York --utc

###############################################################################
# Bootloader
###############################################################################
bootloader --location=mbr --boot-drive=sda --timeout=5

###############################################################################
# Partition Clearing
###############################################################################
clearpart --all --initlabel --drives=sda
zerombr

###############################################################################
# Disk Partitioning (adjust sizes to suit your environment)
###############################################################################
part /boot      --fstype="xfs"  --ondisk=sda --size=1024
part /boot/efi  --fstype="efi"  --ondisk=sda --size=600  --fsoptions="umask=0077,shortname=winnt"
part pv.01      --fstype="lvmpv" --ondisk=sda --grow

volgroup vg_rhel9 pv.01

logvol swap     --fstype="swap"  --vgname=vg_rhel9 --name=lv_swap --size=4096
logvol /        --fstype="xfs"   --vgname=vg_rhel9 --name=lv_root --size=20480
logvol /home    --fstype="xfs"   --vgname=vg_rhel9 --name=lv_home --size=10240
logvol /var     --fstype="xfs"   --vgname=vg_rhel9 --name=lv_var  --size=10240
logvol /tmp     --fstype="xfs"   --vgname=vg_rhel9 --name=lv_tmp  --size=4096 --fsoptions="nodev,nosuid,noexec"

###############################################################################
# Package Selection
###############################################################################
%packages
@^minimal-environment
@standard
chrony
openssh-server
sudo
vim-enhanced
wget
curl
net-tools
bind-utils
bash-completion
tmux
rsync
# Remove packages not needed for a minimal secure server
-iwl*firmware
-aic94xx-firmware
-atmel-firmware
-b43-openfwwf
-bfa-firmware
-ipw2100-firmware
-ipw2200-firmware
-ivtv-firmware
-libertas-usb8388-firmware
-ql*-firmware
-rt61pci-firmware
-rt73usb-firmware
-xorg-x11-drv-ati-firmware
-zd1211-firmware
%end

###############################################################################
# Pre-installation Script
###############################################################################
%pre --log=/tmp/ks-pre.log
#!/bin/bash
# Any pre-installation tasks go here
echo "Starting RHEL 9 installation: $(date)" > /tmp/ks-pre.log
%end

###############################################################################
# Post-installation Script
###############################################################################
%post --log=/var/log/ks-post.log
#!/bin/bash
set -euo pipefail

echo "Post-install configuration started: $(date)"

# Harden SSH
sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
sed -i 's/^#X11Forwarding.*/X11Forwarding no/' /etc/ssh/sshd_config
echo "Protocol 2" >> /etc/ssh/sshd_config

# Set secure umask
echo "umask 027" >> /etc/profile.d/umask.sh

# Disable unused filesystems (CIS hardening)
cat > /etc/modprobe.d/disable-filesystems.conf << 'EOF'
install cramfs /bin/true
install freevxfs /bin/true
install jffs2 /bin/true
install hfs /bin/true
install hfsplus /bin/true
install squashfs /bin/true
install udf /bin/true
EOF

# Enable automatic security updates
dnf install -y dnf-automatic
sed -i 's/^apply_updates = .*/apply_updates = yes/' /etc/dnf/automatic.conf
systemctl enable --now dnf-automatic.timer

# Configure chronyd for time sync
cat > /etc/chrony.conf << 'EOF'
pool 2.rhel.pool.ntp.org iburst
driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
logdir /var/log/chrony
EOF
systemctl enable --now chronyd

# Set kernel parameters for security
cat > /etc/sysctl.d/99-security.conf << 'EOF'
# Disable IP forwarding
net.ipv4.ip_forward = 0
# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
# Enable reverse path filtering
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
# Enable SYN cookies
net.ipv4.tcp_syncookies = 1
# Disable IPv6 if not needed
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
EOF
sysctl --system

echo "Post-install configuration complete: $(date)"
%end

###############################################################################
# Reboot after installation
###############################################################################
reboot --eject
